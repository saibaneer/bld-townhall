name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      # The deterministic concurrency lane: loom explores every interleaving of
      # the replay window's lock. A probabilistic race passes a broken
      # check-then-insert by scheduler mood; this cannot.
      - run: cargo test -p townhall-channel --features loom --test loom
