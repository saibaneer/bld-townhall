[workspace]
resolver = "2"
members = [
  "crates/bld-types",
  "crates/bld-manifest",
  "crates/bld-client",
  "crates/bld-kernel",
  "crates/townhall-domain",
  "crates/townhall-store",
  "crates/townhall-service",
  "crates/council-wire",
  "crates/council-client",
  "crates/townhall-http",
  "crates/townhall-authority",
  "crates/townhall-payment",
  "crates/stripe-client",
  "crates/twilio-client",
  "crates/townhall-effects-router",
  "crates/townhall-usage",
  "crates/townhall-channel",
  "crates/townhall-gateway",
  "crates/townhall-orchestrator",
  "crates/townhall-agent",
  "crates/townhall-testkit",
  "services/mock-council",
  "services/mock-stripe",
  "services/townhall-server",
  "services/sms-simulator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.91"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
static_assertions = "1"
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
axum = "0.8"
# No TLS feature: this client talks to a council on localhost over plain HTTP.
# Provenance here comes from the signature on the payload, not from the
# transport, which is deliberate — a signed answer is verifiable after it has
# been stored, relayed or replayed, and a TLS session is not.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
base64 = "0.23"
sha2 = "0.11"
# SHA-1 for Twilio's `X-Twilio-Signature` (M12). Twilio fixed this webhook MAC as
# HMAC-SHA1 years ago; the algorithm is theirs, not ours, so SHA-1 here is a
# compatibility requirement, not a security choice — it authenticates an inbound
# webhook against the account's own Auth Token, nothing more.
sha1 = "0.11"
# HMAC for the delegation envelope's authentication tag (M7B).
#
# A MAC rather than the council's ed25519: the server both writes and verifies
# these tags, so there is no second party to hold a public key, and a symmetric
# tag is the smaller thing to get right. RustCrypto's `hmac`, because a
# hand-rolled `H(key || data)` over SHA-256 is length-extendable and this is
# exactly the place not to be clever.
hmac = "0.13"

# Build-output size, which is a real constraint at this shape of workspace.
#
# A `cargo clean` here removed **49 GB across 446,906 files**. The arithmetic:
# 22 integration-test files, each compiled into its OWN fully-linked executable
# that statically links tokio, reqwest, axum and sqlx; 246 crates in the graph;
# and those built under four different feature sets (default, --all-features,
# dev-authority, loom), which Cargo keeps side by side because each feature
# resolution is a separate fingerprint. Cargo never garbage-collects
# superseded artifacts, so every signature change leaves the old ones behind.
#
# Neither setting affects a release build, CI (which builds fresh), or anything
# shipped.
[profile.dev]
# `file:line` in every backtrace, without the full DWARF that dominates the
# size of a debug binary. This is what the `debug = true` default buys and what
# a test failure actually needs — a panic still names its file and line.
debug = "line-tables-only"
# The file-count fix, and macOS-specific.
#
# The dev default here is "unpacked": debug info stays in hundreds of thousands
# of loose `.o` files rather than being collected. That is the only thing that
# explains a six-figure file count, and it makes `cargo clean` itself slow.
split-debuginfo = "packed"

[workspace.lints.rust]
unsafe_code = "forbid"
# `kani` is set by the Kani model checker (cargo kani), not by Cargo, so declare
# it as a known cfg — the kernel's `#[cfg(kani)]` proof harnesses would otherwise
# trip `unexpected_cfgs` under `-D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
