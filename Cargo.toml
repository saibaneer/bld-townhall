[workspace]
resolver = "2"
members = [
  "crates/bld-types",
  "crates/bld-kernel",
  "crates/townhall-domain",
  "crates/townhall-store",
  "crates/townhall-service",
  "crates/council-wire",
  "crates/council-client",
  "crates/townhall-http",
  "crates/townhall-channel",
  "crates/townhall-gateway",
  "crates/townhall-orchestrator",
  "crates/townhall-testkit",
  "services/mock-council",
  "services/townhall-server",
  "services/sms-simulator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.91"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
static_assertions = "1"
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
axum = "0.8"
# No TLS feature: this client talks to a council on localhost over plain HTTP.
# Provenance here comes from the signature on the payload, not from the
# transport, which is deliberate — a signed answer is verifiable after it has
# been stored, relayed or replayed, and a TLS session is not.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
base64 = "0.23"
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
