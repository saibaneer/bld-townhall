[package]
name = "stripe-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
bld-kernel = { path = "../bld-kernel" }
bld-types = { path = "../bld-types" }
# reqwest 0.13 names its rustls-backed TLS feature `rustls` (the 0.12 name was
# `rustls-tls`). This unifies TLS into the workspace's shared reqwest build, as
# ADR-030 records.
reqwest = { workspace = true, features = ["form", "query", "rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
townhall-domain = { path = "../townhall-domain" }
townhall-service = { path = "../townhall-service" }

[dev-dependencies]
mock-stripe = { path = "../../services/mock-stripe", features = ["test-faults"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
