[package]
name = "twilio-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
# reqwest 0.13 names its rustls-backed TLS feature `rustls` (ADR-030). `form`
# encodes the Messages.json POST body; `query` is unused here but keeps the
# shared reqwest feature set aligned with stripe-client.
reqwest = { workspace = true, features = ["form", "rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# X-Twilio-Signature = base64(HMAC-SHA1(auth_token, url + sorted params)). `hmac`
# gives constant-time verification (`verify_slice`); `sha1` is Twilio's fixed
# choice of MAC; `base64` decodes the header. See ADR (M12) for why SHA-1 here.
hmac = { workspace = true }
sha1.workspace = true
base64.workspace = true

[features]
# The isolated live lane (M12), mirroring stripe-client's `stripe-live`: opt-in,
# never part of a normal `cargo test`. It gates `tests/live.rs`, which sends ONE
# real SMS through api.twilio.com — the one thing no hermetic test can prove (our
# request encoding and response parsing match real Twilio). Needs TWILIO_SID,
# TWILIO_CLIENT_SECRET and TWILIO_FROM_NUMBER in the environment, plus network.
twilio-live = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# A oneshot in-process mock of Messages.json, so the request ENCODING (path,
# basic auth, form fields) is proven hermetically — no network, no real Twilio.
axum = { workspace = true }
# The `twilio-live` lane constructs a real client against api.twilio.com.
reqwest = { workspace = true, features = ["rustls"] }

[lints]
workspace = true
