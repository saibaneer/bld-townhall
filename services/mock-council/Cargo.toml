[package]
name = "mock-council"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mock-council"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
axum.workspace = true
council-wire = { path = "../../crates/council-wire" }
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time", "net"] }
futures-util = { version = "0.3", default-features = false, optional = true }

[features]
test-faults = ["dep:futures-util"]

[dev-dependencies]
async-trait.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking"] }
tempfile.workspace = true

[lints]
workspace = true
