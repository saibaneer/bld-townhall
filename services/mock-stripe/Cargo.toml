[package]
name = "mock-stripe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mock-stripe"
path = "src/main.rs"

[dependencies]
axum.workspace = true
futures-util = { version = "0.3", default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time", "net"] }

[features]
test-faults = ["dep:futures-util"]

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking"] }

[lints]
workspace = true
