[package]
name = "townhall-server"
version = "0.1.0"
edition = "2024"

# The COMPOSITION-ROOT binary (ADR-021): the one place the concrete world is
# wired — the SQLite store, the denial log, the council client, the pursuit
# configuration, the authority resolver — before being handed to the
# townhall-http adapter as trait objects. No handler logic lives here.
[dependencies]
axum.workspace = true
council-client = { path = "../../crates/council-client" }
council-wire = { path = "../../crates/council-wire" }
stripe-client = { path = "../../crates/stripe-client" }
bld-kernel = { path = "../../crates/bld-kernel" }
townhall-payment = { path = "../../crates/townhall-payment" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
# The dev resolver issues real grants now — nothing asserts its own
# authority any more (ADR-025).
# The pool type only: the composition root hands one to the authority
# store, and naming a type is the least it can do to pass it along.
async-trait = { workspace = true }
sqlx = { workspace = true }
townhall-authority = { path = "../../crates/townhall-authority" }
townhall-channel = { path = "../../crates/townhall-channel" }
townhall-domain = { path = "../../crates/townhall-domain" }
townhall-effects-router = { path = "../../crates/townhall-effects-router" }
townhall-http = { path = "../../crates/townhall-http" }
townhall-service = { path = "../../crates/townhall-service" }
townhall-store = { path = "../../crates/townhall-store" }
townhall-usage = { path = "../../crates/townhall-usage" }
bld-types = { path = "../../crates/bld-types" }
bld-manifest = { path = "../../crates/bld-manifest" }
serde_json = { workspace = true }
serde = { workspace = true }

[features]
# The M5 stand-in authority (ADR-021, amended by ADR-022): a fixed three-token
# allowlist, compiled
# only when asked for AND armed only by the --dev-authority flag. M7 replaces
# the resolver here, in the composition root, so no fallback survives it.
dev-authority = []

[dev-dependencies]
# The no-feature lane needs a channel binding to exist before a READ is scoped
# to anybody, and there is no endpoint that creates one — binding a phone is
# M7C's, with the verification flow. So that lane writes the row through the
# store, which is the same surface the composition root uses.
bld-types = { path = "../../crates/bld-types" }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true }
townhall-authority = { path = "../../crates/townhall-authority" }
townhall-store = { path = "../../crates/townhall-store" }
# The M10 payment E2E signs webhooks with `sign_webhook` — the verifier's exact
# inverse, so the test presents a provably-real Stripe signature, not one merely
# self-consistent with our own verifier. `test-signing` is test-only.
townhall-payment = { path = "../../crates/townhall-payment", features = ["test-signing"] }

[lints]
workspace = true
